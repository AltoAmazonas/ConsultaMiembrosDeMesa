<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONPE - Consulta de Miembros de Mesa</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
    
    <!-- Encabezado Inicial con distintivo ONPE suave -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center gap-2 bg-slate-100 text-slate-700 font-black text-lg px-4 py-2 rounded-xl mb-3 border border-slate-300 shadow-sm">
        <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span class="tracking-wider">ONPE</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Consulta de Miembros de Mesa</h1>
      <p class="text-sm font-semibold text-slate-600 mt-1">Elecciones Regionales y Municipales 2026</p>
      <p class="text-xs text-slate-500 font-bold mt-1">Sólo Alto Amazonas y Datem del Marañón - LORETO</p>
    </div>

    <!-- Buscador -->
    <div class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="dniInput" 
        maxlength="9" 
        placeholder="Ingresa tu DNI" 
        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-400 text-center text-lg tracking-widest font-bold text-slate-700 bg-slate-50"
      >
      <button 
        onclick="consultarDNI()" 
        class="bg-slate-700 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-md active:scale-95"
      >
        Buscar
      </button>
    </div>

    <!-- Tarjeta de Resultados (Positivo) -->
    <div id="resultado" class="hidden space-y-4 pt-2 border-t border-slate-100">
      
      <!-- Aviso Llamativo Superior -->
      <div class="bg-emerald-500 text-white text-center py-2.5 px-4 rounded-xl shadow-sm animate-pulse">
        <p class="text-base font-black uppercase tracking-wide">¡SÍ ERES MIEMBRO DE MESA! Provecho!!</p>
      </div>

      <!-- Nombre Completo -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
        <span class="text-xs text-slate-500 font-bold uppercase tracking-wider">Nombre y Apellido Completo</span>
        <p id="resNombre" class="text-base font-extrabold text-slate-800 uppercase mt-1"></p>
      </div>

      <!-- Mesa y Cargo -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-center">
          <span class="text-xs text-slate-400 font-bold uppercase">N° de Mesa</span>
          <p id="resMesa" class="text-xl font-black text-slate-800 mt-0.5"></p>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-center">
          <span class="text-xs text-slate-400 font-bold uppercase">Cargo</span>
          <p id="resCargo" class="text-sm font-extrabold text-emerald-600 mt-1 uppercase"></p>
        </div>
      </div>

      <!-- DNI -->
      <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-sm text-slate-700">
        <p class="flex justify-between items-center"><span class="font-medium text-slate-400">DNI:</span> <span id="resDni" class="font-bold text-base"></span></p>
      </div>

    </div>

    <!-- Alerta de Respuesta Negativa / Error -->
    <div id="mensaje" class="hidden text-center p-4 rounded-xl mt-4"></div>

    <!-- Firma del Desarrollador (Siempre visible en pantalla inicial, positiva y negativa) -->
    <div class="pt-5 mt-4 text-center border-t border-slate-100">
      <p class="text-xs text-slate-400 tracking-wide">Designed and Developed by <strong class="text-slate-700 font-bold">Reynaldus</strong></p>
    </div>

  </div>

  <script>
    let bdMiembros = {};

    // Cargar la base de datos JSON
    fetch('datos.json')
      .then(response => response.json())
      .then(data => {
        bdMiembros = data;
      })
      .catch(error => {
        console.error('Error al cargar datos.json:', error);
      });

    function consultarDNI() {
      const dniInput = document.getElementById('dniInput').value.trim();
      const resContainer = document.getElementById('resultado');
      const msgContainer = document.getElementById('mensaje');

      resContainer.classList.add('hidden');
      msgContainer.classList.add('hidden');

      if (!/^\d{8,9}$/.test(dniInput)) {
        msgContainer.textContent = "⚠️ Por favor, ingresa un número de DNI válido de 8 o 9 dígitos.";
        msgContainer.className = "text-center text-sm font-bold p-4 rounded-xl bg-amber-50 text-amber-800 border border-amber-200";
        msgContainer.classList.remove('hidden');
        return;
      }

      let persona = bdMiembros[dniInput] || bdMiembros[dniInput.substring(0, 8)];

      if (persona) {
        document.getElementById('resDni').textContent = persona.dni;
        document.getElementById('resNombre').textContent = persona.nombre;
        document.getElementById('resMesa').textContent = persona.mesa;
        document.getElementById('resCargo').textContent = persona.cargo;

        resContainer.classList.remove('hidden');
      } else {
        msgContainer.textContent = "NO HAS SIDO SORTEADO COMO MIEMBRO DE MESA. ¡¡ANDA VOTA NOMÁS!!";
        msgContainer.className = "text-center text-base font-black p-4 rounded-xl bg-red-50 text-red-600 border border-red-200 uppercase tracking-wide";
        msgContainer.classList.remove('hidden');
      }
    }

    // Permitir consulta al presionar Enter
    document.getElementById('dniInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') consultarDNI();
    });
  </script>
</body>
</html>
