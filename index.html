<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Miembros de Mesa - Elecciones 2026</title>
  <!-- Tailwind CSS para diseño limpio y profesional -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
    
    <!-- Encabezado Inicial -->
    <div class="text-center mb-6">
      <div class="inline-block bg-blue-100 text-blue-700 p-3 rounded-full mb-3 text-2xl">
        🗳️
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Consulta de Miembros de Mesa</h1>
      <p class="text-sm font-semibold text-blue-600 mt-1">Elecciones Regionales y Municipales 2026</p>
      <p class="text-xs text-slate-500 font-medium mt-0.5">Sólo Alto Amazonas y Datem del Marañón</p>
    </div>

    <!-- Buscador -->
    <div class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="dniInput" 
        maxlength="8" 
        placeholder="Ingresa tu DNI" 
        class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg tracking-widest font-bold text-slate-700 bg-slate-50"
      >
      <button 
        onclick="consultarDNI()" 
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-md active:scale-95"
      >
        Buscar
      </button>
    </div>

    <!-- Tarjeta de Resultados -->
    <div id="resultado" class="hidden space-y-3 pt-2 border-t border-slate-100">
      
      <!-- Nombre Completo -->
      <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
        <span class="text-xs text-blue-600 font-bold uppercase tracking-wider">Nombre y Apellido Completo</span>
        <p id="resNombre" class="text-base font-extrabold text-slate-800 uppercase mt-0.5"></p>
      </div>

      <!-- Mesa y Cargo -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-center">
          <span class="text-xs text-slate-400 font-bold uppercase">N° de Mesa</span>
          <p id="resMesa" class="text-xl font-black text-blue-600 mt-0.5"></p>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-center">
          <span class="text-xs text-slate-400 font-bold uppercase">Cargo</span>
          <p id="resCargo" class="text-sm font-extrabold text-emerald-600 mt-1 uppercase"></p>
        </div>
      </div>

      <!-- Ubicación y DNI -->
      <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2 text-sm text-slate-700">
        <p class="flex justify-between border-b pb-1"><span class="font-medium text-slate-400">DNI:</span> <span id="resDni" class="font-bold"></span></p>
        <p class="flex justify-between border-b pb-1"><span class="font-medium text-slate-400">Distrito:</span> <span id="resDistrito" class="font-bold"></span></p>
        <p class="flex justify-between border-b pb-1"><span class="font-medium text-slate-400">Provincia:</span> <span id="resProvincia" class="font-bold"></span></p>
        <p class="flex justify-between"><span class="font-medium text-slate-400">Departamento:</span> <span id="resDepartamento" class="font-bold"></span></p>
      </div>

      <!-- Firma del desarrollador -->
      <div class="pt-3 text-center border-t border-slate-100">
        <p class="text-xs font-semibold text-slate-400 tracking-wide">Designed and Developed by The King</p>
      </div>

    </div>

    <!-- Alerta de Error / Mensajes -->
    <div id="mensaje" class="hidden text-center text-sm font-semibold p-3.5 rounded-xl mt-4"></div>

  </div>

  <script>
    let bdMiembros = {};

    // Cargar la base de datos JSON al abrir la página
    fetch('datos.json')
      .then(response => response.json())
      .then(data => {
        bdMiembros = data;
      })
      .catch(error => {
        console.error('Error al cargar datos.json:', error);
      });

    function consultarDNI() {
      const dni = document.getElementById('dniInput').value.trim();
      const resContainer = document.getElementById('resultado');
      msgContainer = document.getElementById('mensaje');

      resContainer.classList.add('hidden');
      msgContainer.classList.add('hidden');

      if (dni.length !== 8 || isNaN(dni)) {
        msgContainer.textContent = "⚠️ Ingresa un DNI válido de 8 dígitos.";
        msgContainer.className = "text-center text-sm font-semibold p-3.5 rounded-xl bg-amber-50 text-amber-700 border border-amber-200";
        msgContainer.classList.remove('hidden');
        return;
      }

      if (bdMiembros[dni]) {
        const persona = bdMiembros[dni];
        document.getElementById('resDni').textContent = persona.dni;
        document.getElementById('resNombre').textContent = persona.nombre;
        document.getElementById('resMesa').textContent = persona.mesa;
        document.getElementById('resCargo').textContent = persona.cargo;
        document.getElementById('resDistrito').textContent = persona.distrito;
        document.getElementById('resProvincia').textContent = persona.provincia;
        document.getElementById('resDepartamento').textContent = persona.departamento;

        resContainer.classList.remove('hidden');
      } else {
        msgContainer.textContent = "❌ El DNI ingresado no figura en la lista de miembros de mesa.";
        msgContainer.className = "text-center text-sm font-semibold p-3.5 rounded-xl bg-red-50 text-red-700 border border-red-200";
        msgContainer.classList.remove('hidden');
      }
    }

    // Permitir consulta al presionar Enter
    document.getElementById('dniInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') consultarDNI();
    });
  </script>
</body>
</html>
